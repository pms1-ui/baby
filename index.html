<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빤짝이네 육아정보 책장</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gate-container">
        <div class="emoji-header">👶</div>
        <h1 class="gate-title">빤짝이네 육아정보 책장</h1>
        <div class="button-list">
            <a href="pages/daycare-tips.html" class="gate-button">출생아기 어린이집 중간입소 꿀팁</a>
            <a href="pages/support-money.html" class="gate-button">2026 임신·출산·육아 지원금 총정리</a>
            <a href="pages/husband-checklist.html" class="gate-button">출산 후 남편이 해야 할 일 총정리</a>
            <a href="pages/daycare-guide.html" class="gate-button">어린이집 입소대기 완벽 가이드</a>
            <a href="pages/csection-items.html" class="gate-button">제왕절개 산모 병원·조리원 꿀아이템</a>
            <a href="pages/119-safety.html" class="gate-button">임산부 119 안심콜 서비스</a>
            <a href="pages/newborn-care.html" class="gate-button">신생아 육아 총정리</a>
            <a href="pages/newborn-outing.html" class="gate-button">신생아 외출 가이드</a>
            <a href="pages/child-account.html" class="gate-button">아동수당 계좌 세팅 실전 노트</a>
            <a href="javascript:void(0)" class="gate-button gate-button--special" onclick="openLockModal('pages/realestate-study.html')">빤짝이네 부동산공부</a>
            <a href="javascript:void(0)" class="gate-button gate-button--special" onclick="openLockModal('pages/wealth-study.html')">빤짝이네 재테크·투자공부</a>
            <a href="javascript:void(0)" class="gate-button gate-button--special" onclick="openLockModal('pages/selfdev-study.html')">빤짝이네 자기계발 책장</a>
        </div>
    </div>

    <!-- 비밀번호 모달 -->
    <div id="lockModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <p class="modal-title">🔒 비밀번호를 입력하세요</p>
            <input type="password" id="lockInput" class="modal-input" maxlength="4" inputmode="numeric">
            <div class="modal-buttons">
                <button onclick="closeLockModal()" class="modal-btn modal-btn--cancel">취소</button>
                <button onclick="checkPassword()" class="modal-btn modal-btn--confirm">확인</button>
            </div>
            <p id="lockError" class="modal-error" style="display:none;">비밀번호가 틀렸습니다.</p>
        </div>
    </div>

    <script>
    let targetUrl = '';
    function openLockModal(url) {
        targetUrl = url;
        document.getElementById('lockModal').style.display = 'flex';
        document.getElementById('lockInput').value = '';
        document.getElementById('lockError').style.display = 'none';
        setTimeout(() => document.getElementById('lockInput').focus(), 100);
    }
    function closeLockModal() {
        document.getElementById('lockModal').style.display = 'none';
        targetUrl = '';
    }
    function checkPassword() {
        const input = document.getElementById('lockInput').value;
        if (input === '7720') {
            window.location.href = targetUrl;
        } else {
            document.getElementById('lockError').style.display = 'block';
            document.getElementById('lockInput').value = '';
            document.getElementById('lockInput').focus();
        }
    }
    document.getElementById('lockInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') checkPassword();
    });
    document.getElementById('lockModal').addEventListener('click', function(e) {
        if (e.target === this) closeLockModal();
    });
    </script>
</body>
</html>
